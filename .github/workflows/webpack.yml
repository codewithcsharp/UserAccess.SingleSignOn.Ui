name: User SSO UI CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: user.sso.ui

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: user.sso.ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      env:
        CI: true
      run: |
        if find src -type f \( -name '*.test.js' -o -name '*.test.jsx' -o -name '*.spec.js' -o -name '*.spec.jsx' \) | grep -q .; then
          npm test -- --watchAll=false
        else
          echo "::warning::No test files found; add tests to make this CI gate meaningful."
        fi

    - name: Build production bundle
      run: npm run build
